<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta página no existe — Blas Ruiz</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;
    background:#f1f1f0;color:#333;
    font-family:'Onest',Arial,system-ui,sans-serif;
    line-height:1.6;
    padding:clamp(1.5rem,6vw,5rem);
  }
  .env{max-width:34rem}
  .rotulo{
    font-family:ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.18em;
    text-transform:uppercase;color:#a3a3a3;margin:0 0 2rem;
    display:flex;align-items:center;gap:.9rem;
  }
  .punto{width:6px;height:6px;border-radius:50%;background:#ff8666}
  h1{
    font-family:'Outfit','Trebuchet MS',sans-serif;font-weight:500;
    font-size:clamp(2.2rem,1.6rem + 2.6vw,3.6rem);
    line-height:1.06;letter-spacing:-.03em;margin:0 0 1.25rem;
  }
  p{color:#4a4a4a;margin:0 0 2.25rem;max-width:40ch}
  a{
    display:inline-flex;align-items:center;gap:.7rem;
    background:#333;color:#f1f1f0;text-decoration:none;
    font-weight:500;padding:1.1rem 1.6rem;border:1px solid #333;border-radius:2px;
    transition:background .28s ease,color .28s ease,border-color .28s ease;
  }
  a:hover{background:#ff8666;color:#333;border-color:#ff8666}
  a:focus-visible{outline:2px solid #ff8666;outline-offset:3px}
</style>
</head>
<body>
  <div class="env">
    <p class="rotulo"><span class="punto"></span> Error 404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que haya cambiado de sitio. Lo que buscas probablemente esté en la portada.</p>
    <a href="/">Volver al inicio <span aria-hidden="true">→</span></a>
  </div>
</body>
</html>
